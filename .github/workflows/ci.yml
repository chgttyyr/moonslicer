name: MoonSlicer CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install MoonBit CLI Toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Verify Environment
        run: |
          moon version --all

      - name: Type Check Project
        run: |
          moon check

      - name: Run Test Suite
        run: |
          moon test

      - name: Build Executable Artifacts
        run: |
          moon build

      - name: Verify CLI Functionality
        run: |
          moon run cmd/main -- help
          moon run cmd/main -- info -i fixtures/calibration_cube_ascii.stl
          moon run cmd/main -- slice -i fixtures/calibration_cube_ascii.stl -o ci_test.gcode --layer-height 0.4 --density 0.1
